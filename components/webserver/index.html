<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESP32-S3 Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        :root {
            --dash-bg: #0f172a;
            --dash-card: #1e293b;
            --dash-accent: #38bdf8;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, rgba(56, 189, 248, 0.18), transparent 40%),
                var(--dash-bg);
            color: #e2e8f0;
        }

        .navbar {
            background-color: rgba(15, 23, 42, 0.92);
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        }

        .status-dot {
            width: 0.7rem;
            height: 0.7rem;
            border-radius: 50%;
            display: inline-block;
        }

        .card {
            background-color: var(--dash-card);
            border: 1px solid rgba(148, 163, 184, 0.18);
            color: inherit;
        }

        .hero-title {
            color: var(--dash-accent);
            letter-spacing: 0.04em;
        }

        .meta-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">ESP32-S3</span>
            <span class="d-flex align-items-center gap-2">
                <span id="wifiDot" class="status-dot bg-secondary"></span>
                <span id="wifiLabel" class="small">Checking Wi-Fi…</span>
            </span>
        </div>
    </nav>

    <main class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg p-4 p-md-5 text-center">
                    <p class="meta-label mb-2">Web server</p>
                    <h1 class="display-4 fw-semibold hero-title mb-3">Hello World</h1>
                    <p class="lead mb-4">Vanilla HTML, CSS, and JavaScript with Bootstrap 5.</p>
                    <div class="d-flex flex-wrap justify-content-center gap-2">
                        <span id="serverBadge" class="badge text-bg-secondary">Server: checking</span>
                        <span id="ssidBadge" class="badge text-bg-dark">SSID: —</span>
                        <span id="ipBadge" class="badge text-bg-dark">IP: —</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <script>
        const wifiDot = document.getElementById("wifiDot");
        const wifiLabel = document.getElementById("wifiLabel");
        const serverBadge = document.getElementById("serverBadge");
        const ssidBadge = document.getElementById("ssidBadge");
        const ipBadge = document.getElementById("ipBadge");

        function renderStatus(data) {
            const connected = Boolean(data && data.connected);
            wifiDot.className = "status-dot " + (connected ? "bg-success" : "bg-danger");
            wifiLabel.textContent = connected ? "Wi-Fi connected" : "Wi-Fi disconnected";
            serverBadge.className = "badge " + (connected ? "text-bg-success" : "text-bg-warning");
            serverBadge.textContent = connected ? "Server: online" : "Server: waiting";
            ssidBadge.textContent = "SSID: " + ((data && data.ssid) || "—");
            ipBadge.textContent = "IP: " + ((data && data.ip) || "—");
        }

        async function refreshStatus() {
            try {
                const response = await fetch("/api/status", { cache: "no-store" });
                if (!response.ok) {
                    throw new Error("status " + response.status);
                }
                renderStatus(await response.json());
            } catch (error) {
                renderStatus({ connected: false, ssid: "", ip: "" });
                wifiLabel.textContent = "Status unavailable";
            }
        }

        refreshStatus();
        setInterval(refreshStatus, 3000);
    </script>
</body>
</html>
